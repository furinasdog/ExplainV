# 敏感信息模板 —— 部署前用真实值替换 base64 编码内容
#
# 生成方式（示例）：
#   echo -n "your-api-key" | base64
#   echo -n "your-workspace-id" | base64
#
# 生产环境建议使用阿里云 KMS 或 Sealed Secrets 管理
apiVersion: v1
kind: Secret
metadata:
  name: explainv-secrets
  namespace: explainv
type: Opaque
data:
  EXPLAINV_API_URL: "REPLACE_WITH_BASE64"          # echo -n "https://..." | base64
  EXPLAINV_API_KEY: "REPLACE_WITH_BASE64"          # echo -n "sk-..." | base64
  EXPLAINV_USE_MODEL: "REPLACE_WITH_BASE64"        # echo -n "qwen3.7-plus" | base64
  DASHSCOPE_WORKSPACE_ID: "REPLACE_WITH_BASE64"    # echo -n "ws-..." | base64
  DASHSCOPE_WORKSPACE_KEY: "REPLACE_WITH_BASE64"   # echo -n "key-..." | base64
