apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: explainv-api
  namespace: explainv
  labels:
    app: explainv-api
spec:
  serviceName: explainv-api-headless
  replicas: 0
  selector:
    matchLabels:
      app: explainv-api
  template:
    metadata:
      labels:
        app: explainv-api
    spec:
      dnsPolicy: Default
      containers:
        - name: api
a          image: crpi-75bc6vhx9od6qai2.cn-hangzhou.personal.cr.aliyuncs.com/explainv/explainv:v1.3.5
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: explainv-config
            - secretRef:
                name: explainv-secrets
          resources:
            requests:
              cpu: "2"
              memory: 4Gi
            limits:
              cpu: "4"
              memory: 8Gi
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
