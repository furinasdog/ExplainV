apiVersion: apps/v1
kind: Deployment
metadata:
  name: explainv-api
  namespace: explainv
  labels:
    app: explainv-api
spec:
  # 默认 0 副本，由 WebUI 后端按需扩缩
  replicas: 0
  selector:
    matchLabels:
      app: explainv-api
  template:
    metadata:
      labels:
        app: explainv-api
    spec:
      dnsPolicy: Default
      containers:
        - name: api
          image: crpi-75bc6vhx9od6qai2.cn-hangzhou.personal.cr.aliyuncs.com/explainv/explainv:v1.3.3
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: explainv-config
            - secretRef:
                name: explainv-secrets
          volumeMounts:
            - name: data-volume
              mountPath: /app/data
          resources:
            requests:
              cpu: "2"
              memory: 4Gi
            limits:
              cpu: "4"                  # Manim 渲染吃 CPU
              memory: 8Gi               # TeX + Manim 吃内存
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            # busy 时不拒绝（避免任务执行中被摘除），
            # 由 UI 后端通过 /health 的 busy 字段决定是否发送新任务
      volumes:
        - name: data-volume
          emptyDir: {}
